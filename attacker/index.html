<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Security Labs 2026</title>
  <style>
    :root {
      --bg:#0d1117; --panel:#161b22; --border:#30363d; --fg:#e6edf3;
      --muted:#8b949e; --accent:#ff5252; --ok:#2ecc71;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }   /* flex等の display 指定より hidden を優先 */
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; font-family: system-ui, sans-serif;
      background: var(--bg); color: var(--fg);
    }

    /* 左サイドバー: 攻撃の種類を選ぶ */
    .sidebar {
      width: 260px; flex: 0 0 260px; height: 100vh; overflow-y: auto;
      background: var(--panel); border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
    }
    .brand { padding: 18px 16px; border-bottom: 1px solid var(--border); }
    .brand h1 { font-size: 15px; margin: 0; }
    .brand p { font-size: 11px; color: var(--muted); margin: 4px 0 0; }

    nav { padding: 8px; flex: 1; }
    .nav-sec { font-size: 10px; color: var(--muted); text-transform: uppercase;
               letter-spacing: .05em; margin: 12px 8px 4px; }
    .item {
      display: block; width: 100%; text-align: left; cursor: pointer;
      background: none; border: 0; color: var(--fg); font: inherit;
      padding: 10px 12px; border-radius: 8px; margin: 2px 0; line-height: 1.3;
    }
    .item:hover { background: #1f2630; }
    .item.active { background: #243044; box-shadow: inset 3px 0 0 var(--accent); }
    .item .t { font-size: 13px; font-weight: 600; }
    .item .s { font-size: 11px; color: var(--muted); }
    .item.disabled { opacity: .6; }
    .tag { float: right; font-size: 10px; padding: 1px 7px; border-radius: 10px; }
    .tag.ready { background: rgba(46,204,113,.15); color: var(--ok); }
    .tag.soon  { background: rgba(139,148,158,.18); color: var(--muted); }

    .side-foot { padding: 12px 16px; border-top: 1px solid var(--border);
                 font-size: 11px; color: var(--muted); line-height: 1.5; }

    /* 右の本体: 選んだ攻撃デモを表示 */
    .main { flex: 1; height: 100vh; display: flex; flex-direction: column; min-width: 0; }
    .demo-frame { flex: 1; width: 100%; border: 0; background: #111; }
    .empty { flex: 1; display: flex; align-items: center; justify-content: center;
             color: var(--muted); text-align: center; padding: 24px; }

    /* 狭い画面では縦積み */
    @media (max-width: 720px) {
      body { flex-direction: column; }
      .sidebar { width: 100%; flex: none; height: auto; border-right: 0;
                 border-bottom: 1px solid var(--border); }
      .main { height: 70vh; }
    }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <h1>🧪 Security Labs 2026</h1>
      <p>攻撃デモ集 / ローカル隔離・教育用</p>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot">
      左の一覧から攻撃の種類を選ぶと、右側にデモが開きます。<br>
      対象は <code>127.0.0.1</code> のラボのみ。
    </div>
  </aside>

  <div class="main">
    <iframe id="demo" class="demo-frame" title="attack demo"></iframe>
    <div id="empty" class="empty" hidden>
      このモジュールは準備中です。実装され次第、ここに表示されます。
    </div>
  </div>

  <script>
    // 攻撃モジュールの定義。実装したら status:'ready' と src を設定して追加する。
    const MODULES = [
      { id: 'clickjacking', t: 'クリックジャッキング', s: 'ライクジャッキング', status: 'ready', src: 'evil-sns.html' },
      { id: 'xss',          t: 'XSS',                   s: 'クロスサイトスクリプティング', status: 'ready', src: 'evil-xss.html' },
      { id: 'sqli',         t: 'SQLインジェクション',    s: '', status: 'ready', src: 'evil-sqli.html' },
      { id: 'oscmd',        t: 'OSコマンドインジェクション', s: '', status: 'soon' },
      { id: 'pathtrav',     t: 'パストラバーサル',        s: '', status: 'soon' },
      { id: 'csrf',         t: 'CSRF',                   s: 'クロスサイトリクエストフォージェリ', status: 'soon' },
      { id: 'authz',        t: '認可制御の欠落',          s: '', status: 'soon' },
    ];

    const nav = document.getElementById('nav');
    const demo = document.getElementById('demo');
    const empty = document.getElementById('empty');
    let activeId = null;

    function select(mod) {
      if (mod.status !== 'ready') {
        // 準備中: 本体を空表示に
        demo.hidden = true; demo.removeAttribute('src');
        empty.hidden = false;
      } else {
        empty.hidden = true; demo.hidden = false;
        demo.src = mod.src;
      }
      activeId = mod.id;
      location.hash = mod.id;
      render();
    }

    function render() {
      nav.innerHTML = '<div class="nav-sec">攻撃の種類</div>';
      for (const m of MODULES) {
        const el = document.createElement('button');
        el.className = 'item' + (m.status === 'ready' ? '' : ' disabled') + (m.id === activeId ? ' active' : '');
        el.innerHTML =
          '<span class="tag ' + m.status + '">' + (m.status === 'ready' ? '実装済み' : '準備中') + '</span>' +
          '<div class="t">' + m.t + '</div>' +
          (m.s ? '<div class="s">' + m.s + '</div>' : '');
        el.addEventListener('click', () => select(m));   // 準備中も選択可(本体に案内を表示)
        nav.appendChild(el);
      }
    }

    // 初期表示: URLハッシュ、無ければ最初の実装済みモジュール。
    const fromHash = MODULES.find((m) => m.id === location.hash.slice(1));
    const first = MODULES.find((m) => m.status === 'ready');
    select(fromHash || first || MODULES[0]);
  </script>
</body>
</html>
