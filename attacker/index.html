<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Security Labs 2026</title>
  <style>
    /* ========================================================================
       Security Labs 2026 — ラボ・シェル
       デザイン方針(今どきのAIスタートアップの作法を踏襲):
         - 静かで高密度(calm but dense): 階層はタイポと余白で作り、装飾は足さない
         - モノクロ基調 + 単一アクセント(既存デモの coral 系と統一)
         - 開発者ワークベンチ: サイドバーで手法を選び、右に実演を開く
         - システムフォントのみ(外部CDN無し=ローカル隔離の前提を守る)
         - 最小モーション / キーボード操作 / 高コントラスト
       ===================================================================== */
    :root {
      color-scheme: dark;

      /* 面(warm-neutral のダーク。純黒を避けて少し温かく) */
      --bg:        #0b0b0c;
      --surface:   #141416;
      --surface-2: #1b1b1f;
      --surface-3: #232329;
      --border:    #27272b;
      --border-soft:#1f1f23;

      /* 文字 */
      --fg:    #ededf0;
      --muted: #9b9ba3;
      --faint: #6a6a73;

      /* 単一アクセント(ブランド/操作) + 意味色 */
      --accent:     #ff5c47;
      --accent-weak:rgba(255,92,71,.14);
      --accent-line:rgba(255,92,71,.45);
      --ok:     #3fb950;
      --ok-weak:rgba(63,185,80,.14);

      /* タイポ */
      --sans: system-ui, -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN",
              "Noto Sans JP", Meiryo, sans-serif;
      --mono: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono",
              "DejaVu Sans Mono", monospace;

      --radius: 10px;
      --radius-sm: 8px;
      --gutter: 16px;
      --speed: 120ms;
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      font-family: var(--sans);
      background: var(--bg);
      color: var(--fg);
      font-size: 14px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }

    /* ---- 共通: 小さな大文字ラベル(Linear/Vercel 風の節見出し) ---- */
    .kicker {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--faint);
    }
    .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

    /* ======================= 左サイドバー ======================= */
    .sidebar {
      width: 300px; flex: 0 0 300px; height: 100vh; overflow-y: auto;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
    }

    .brand {
      display: flex; align-items: center; gap: 11px;
      padding: 18px 18px 16px;
      border-bottom: 1px solid var(--border-soft);
    }
    .brand .mark {
      width: 34px; height: 34px; flex: 0 0 34px;
      display: grid; place-items: center;
      border-radius: 9px;
      background: linear-gradient(160deg, #202024, #141416);
      border: 1px solid var(--border);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.02);
    }
    .brand .mark svg { width: 18px; height: 18px; display: block; }
    .brand h1 { font-size: 14px; font-weight: 650; margin: 0; letter-spacing: -.01em; }
    .brand p  { margin: 2px 0 0; font-size: 11px; color: var(--muted); }

    /* 進捗メタ(高密度の情報を小さく) */
    .meta {
      display: flex; align-items: center; justify-content: space-between;
      padding: 11px 18px;
      border-bottom: 1px solid var(--border-soft);
    }
    .meta .count { font-size: 12px; color: var(--muted); }
    .meta .count b { color: var(--fg); font-weight: 650; }
    .bar { width: 96px; height: 4px; border-radius: 99px; background: var(--surface-3); overflow: hidden; }
    .bar > i { display: block; height: 100%; background: var(--ok); width: 100%; }

    nav { padding: 10px 10px 6px; flex: 1; }
    .nav-label { padding: 10px 8px 6px; }

    .item {
      position: relative;
      display: grid;
      grid-template-columns: 22px 1fr auto;
      align-items: start; gap: 10px;
      width: 100%; text-align: left; cursor: pointer;
      background: none; border: 0; color: var(--fg); font: inherit;
      padding: 10px 11px; border-radius: var(--radius-sm);
      margin: 1px 0;
      transition: background var(--speed) ease;
    }
    .item:hover { background: var(--surface-2); }
    .item:focus-visible { outline: 2px solid var(--accent-line); outline-offset: -2px; }
    .item.active { background: var(--surface-2); }
    .item.active::before {
      content: ""; position: absolute; left: 0; top: 8px; bottom: 8px;
      width: 2.5px; border-radius: 99px; background: var(--accent);
    }

    .item .idx {
      font-family: var(--mono); font-size: 11px; color: var(--faint);
      padding-top: 2px; font-variant-numeric: tabular-nums;
    }
    .item.active .idx { color: var(--accent); }
    .item .body { display: flex; flex-direction: column; min-width: 0; }
    .item .t { font-size: 13px; font-weight: 600; letter-spacing: -.005em; }
    .item .s { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .item .case {
      align-self: flex-start; margin-top: 7px;
      font-family: var(--mono); font-size: 10px; color: var(--faint);
      background: var(--surface-3); border: 1px solid var(--border);
      padding: 1px 6px; border-radius: 5px;
    }

    /* 状態ドット */
    .dot { width: 7px; height: 7px; border-radius: 99px; margin-top: 6px; }
    .dot.ready { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-weak); }
    .dot.soon  { background: var(--faint); }
    .item.soon .t, .item.soon .s { color: var(--muted); }

    .sidebar-foot {
      padding: 13px 18px; border-top: 1px solid var(--border-soft);
      font-size: 11px; color: var(--faint); line-height: 1.6;
    }
    .sidebar-foot .iso { color: var(--muted); }
    .kbd {
      font-family: var(--mono); font-size: 10px; color: var(--muted);
      background: var(--surface-2); border: 1px solid var(--border);
      border-bottom-width: 2px; border-radius: 5px; padding: 1px 5px;
    }

    /* ========================= 右の本体 ========================= */
    .main { flex: 1; height: 100vh; display: flex; flex-direction: column; min-width: 0; }

    .topbar {
      display: flex; align-items: center; gap: 14px;
      padding: 13px 20px; min-height: 60px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, var(--surface), var(--bg));
    }
    .topbar .lead { min-width: 0; flex: 1; }
    .topbar .title-row { display: flex; align-items: baseline; gap: 10px; }
    .topbar h2 { font-size: 15px; font-weight: 650; margin: 0; letter-spacing: -.01em;
                 white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .topbar .num { font-family: var(--mono); font-size: 12px; color: var(--accent); }
    .topbar .sub { font-size: 12px; color: var(--muted); margin-top: 2px;
                   white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .chip {
      font-family: var(--mono); font-size: 10px; letter-spacing: .02em;
      padding: 3px 8px; border-radius: 6px; white-space: nowrap;
      border: 1px solid var(--border);
    }
    .chip.case { color: var(--muted); background: var(--surface-2); }
    .chip.live { color: var(--accent); background: var(--accent-weak); border-color: var(--accent-line); }

    .actions { display: flex; align-items: center; gap: 8px; }
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      font: inherit; font-size: 12px; color: var(--muted);
      background: var(--surface-2); border: 1px solid var(--border);
      padding: 6px 11px; border-radius: 7px; cursor: pointer;
      transition: background var(--speed) ease, color var(--speed) ease, border-color var(--speed) ease;
    }
    .btn:hover { background: var(--surface-3); color: var(--fg); border-color: #30303a; }
    .btn:focus-visible { outline: 2px solid var(--accent-line); outline-offset: 1px; }
    .btn svg { width: 13px; height: 13px; }

    .demo-wrap { flex: 1; position: relative; background: #0f0f10; min-height: 0; }
    .demo-frame { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #0f0f10; }

    /* ===== 作業領域: デモ + 右のコード比較ペイン ===== */
    .work { flex: 1; display: flex; min-height: 0; }
    .work .demo-wrap { min-width: 0; }

    .code-pane {
      width: 400px; flex: 0 0 400px; min-height: 0;
      display: flex; flex-direction: column;
      background: var(--surface); border-left: 1px solid var(--border);
    }
    .code-head { padding: 12px 14px 10px; border-bottom: 1px solid var(--border-soft); }
    .code-head .where { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-top: 4px; }
    .code-head .point { font-size: 12px; color: var(--fg); margin-top: 6px; line-height: 1.55; }
    .code-head .now { margin-top: 8px; font-size: 11px; color: var(--muted); }
    .code-body { flex: 1; overflow: auto; padding: 10px 10px 14px; }

    .snip {
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      background: var(--bg); margin: 0 0 10px; overflow: hidden;
      transition: opacity var(--speed) ease, border-color var(--speed) ease;
    }
    .snip .label {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 6px 10px; font-size: 11px; font-weight: 600;
      border-bottom: 1px solid var(--border-soft); background: var(--surface-2);
    }
    .snip.vuln .label .name { color: var(--accent); }
    .snip.defense .label .name { color: var(--ok); }
    .snip .running {
      font-family: var(--mono); font-size: 10px; font-weight: 500;
      padding: 1px 6px; border-radius: 5px; visibility: hidden;
    }
    .snip.vuln .running { color: var(--accent); background: var(--accent-weak); }
    .snip.defense .running { color: var(--ok); background: var(--ok-weak); }
    .snip.active .running { visibility: visible; }
    .snip.vuln.active { border-color: var(--accent-line); }
    .snip.defense.active { border-color: rgba(63,185,80,.45); }
    .snip:not(.active) { opacity: .5; }

    .snip pre {
      margin: 0; padding: 8px 0; overflow-x: auto;
      font-family: var(--mono); font-size: 11.5px; line-height: 1.6;
    }
    /* 狭いペインでも読めるよう折り返す。折り返し行は記号の幅だけ字下げ(ぶら下げ)。 */
    .snip .ln {
      display: block; padding: 0 10px 0 20px; text-indent: -14px;
      white-space: pre-wrap; overflow-wrap: anywhere;
    }
    .snip .ln::before {
      content: attr(data-mark); display: inline-block; width: 14px; text-indent: 0;
      color: var(--faint); user-select: none;
    }
    .snip.vuln .ln.diff { background: var(--accent-weak); }
    .snip.vuln .ln.diff::before { color: var(--accent); }
    .snip.defense .ln.diff { background: var(--ok-weak); }
    .snip.defense .ln.diff::before { color: var(--ok); }
    .snip .ln.note { color: var(--faint); font-style: italic; }
    .code-foot { padding: 9px 14px; border-top: 1px solid var(--border-soft); font-size: 11px; color: var(--faint); }

    /* 「コード」ボタンで隠すのはコード部分だけ。右下の学習用コントロールは常に残す。 */
    body.hide-code .code-head, body.hide-code .code-body, body.hide-code .code-foot { display: none; }
    body.hide-code .code-pane { width: 300px; flex-basis: 300px; }
    body.hide-code .controls { flex: 1; border-top: 0; }

    /* ===== 右下: 学習用コントロール =====
       各デモ(iframe)の右上に浮いていた .panel を、読み込み時にここへ移して表示する。
       ラボ画面と各デモは同一オリジンなので DOM ごと移せる(イベントリスナもそのまま動く)。
       デモを単体で開いた(別タブ)ときは、従来どおりデモ内の右上に表示される。 */
    .controls {
      flex: 0 0 auto; max-height: 46%; overflow-y: auto;
      border-top: 1px solid var(--border); background: var(--surface);
      padding: 12px 14px 14px; font-size: 12.5px; color: var(--fg);
    }
    .controls[hidden] { display: none; }
    .controls .panel h2 { display: none; } /* 見出しはペイン側の kicker で出す */
    .controls .panel label {
      display: flex; align-items: center; gap: 8px; margin: 6px 0;
      cursor: pointer; color: var(--fg); font-size: 12.5px;
    }
    .controls .panel input[type="checkbox"] { margin: 0; accent-color: var(--accent); }
    .controls .panel input[type="range"] { accent-color: var(--accent); }
    .controls .panel .hint { color: var(--muted); font-size: 11px; line-height: 1.55; margin: 2px 0 0 22px; }
    .controls .panel hr { border: 0; border-top: 1px solid var(--border-soft); margin: 10px 0; }
    .controls .panel code {
      font-family: var(--mono); font-size: 10.5px; color: var(--fg);
      background: var(--surface-3); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px;
    }
    .controls .panel .status {
      font-weight: 600; font-size: 11px; border-radius: 6px; padding: 2px 8px;
      color: var(--accent); background: var(--accent-weak);
    }
    .controls .panel .status.safe { color: var(--ok); background: var(--ok-weak); }
    .controls .panel button {
      font: inherit; font-size: 12px; color: var(--fg); cursor: pointer;
      background: var(--surface-2); border: 1px solid var(--border); border-radius: 7px; padding: 5px 10px;
    }
    .controls .panel button:hover { background: var(--surface-3); }
    .btn[aria-pressed="true"] { color: var(--fg); border-color: #3a3a44; background: var(--surface-3); }

    @media (max-width: 1100px) {
      .work { flex-direction: column; }
      .code-pane { width: auto; flex: 0 0 42%; border-left: 0; border-top: 1px solid var(--border); }
    }

    .empty {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 10px;
      color: var(--muted); text-align: center; padding: 24px;
    }
    .empty .big { font-size: 15px; color: var(--fg); font-weight: 600; }
    .empty .mk { width: 40px; height: 40px; opacity: .5; }

    /* ====================== レスポンシブ(縦積み) ====================== */
    @media (max-width: 760px) {
      body { flex-direction: column; }
      .sidebar { width: 100%; flex: none; height: auto; max-height: 46vh;
                 border-right: 0; border-bottom: 1px solid var(--border); }
      .main { height: 54vh; }
      .topbar { flex-wrap: wrap; row-gap: 8px; }
      .topbar .lead { flex: 1 1 100%; }
      .topbar .sub { white-space: normal; }
      .actions { flex: 1 1 100%; }
    }
    @media (max-width: 440px) {
      .chip.case { display: none; }
    }

    /* 細いスクロールバー(控えめに) */
    .sidebar::-webkit-scrollbar { width: 10px; }
    .sidebar::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 99px;
      border: 3px solid var(--surface); }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2.5 4.5 5.5v5.2c0 4.6 3.1 8.1 7.5 9.3 4.4-1.2 7.5-4.7 7.5-9.3V5.5L12 2.5Z"
                stroke="#ff5c47" stroke-width="1.5" stroke-linejoin="round"/>
          <path d="M9 11.8l2.1 2.1L15 9.9" stroke="#ff5c47" stroke-width="1.5"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div>
        <h1>Security Labs 2026</h1>
        <p>攻撃デモ集 / ローカル隔離・教育用</p>
      </div>
    </div>

    <div class="meta">
      <span class="count"><b id="readyCount">0</b> / <span id="totalCount">0</span> モジュール実装済み</span>
      <span class="bar"><i id="progressBar" style="width:0%"></i></span>
    </div>

    <nav id="nav" aria-label="攻撃手法の一覧"></nav>

    <div class="sidebar-foot">
      <div class="kicker" style="margin-bottom:6px">Isolation</div>
      <span class="iso">対象は <span class="mono">127.0.0.1</span> のラボのみ。</span><br>
      外部ネットワークへは出しません。<br>
      <div style="margin-top:9px">
        <span class="kbd">↑</span> <span class="kbd">↓</span> / <span class="kbd">J</span> <span class="kbd">K</span> で選択・<span class="kbd">O</span> で別タブ・<span class="kbd">C</span> でコード
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="lead">
        <div class="title-row">
          <span class="num mono" id="barNum"></span>
          <h2 id="barTitle">—</h2>
        </div>
        <div class="sub" id="barSub"></div>
      </div>
      <div class="actions">
        <span class="chip case mono" id="barCase" hidden></span>
        <span class="chip live" id="barLive" hidden>LIVE</span>
        <button class="btn" id="codeBtn" title="脆弱/対策のコードを表示 (C)" aria-pressed="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round"><path d="M8 7l-5 5 5 5"/><path d="M16 7l5 5-5 5"/></svg>
          コード
        </button>
        <button class="btn" id="reloadBtn" title="デモを再読み込み" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v5h-5"/></svg>
          再読み込み
        </button>
        <button class="btn" id="openBtn" title="別タブで開く" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6"/><path d="M20 4l-8.5 8.5"/><path d="M19 13v6a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h6"/></svg>
          別タブ
        </button>
      </div>
    </header>

    <div class="work">
    <div class="demo-wrap">
      <iframe id="demo" class="demo-frame" title="attack demo"></iframe>
      <div id="empty" class="empty" hidden>
        <svg class="mk" viewBox="0 0 24 24" fill="none" stroke="#9b9ba3" stroke-width="1.5"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <div class="big">このモジュールは準備中です</div>
        <div>実装され次第、ここに実演が表示されます。</div>
      </div>
    </div>

    <!-- 右ペイン: 脆弱/対策 の最小コード(attacker/snippets.js)。デモの「🛡 対策を有効化」と連動。 -->
    <aside class="code-pane" id="codePane" aria-label="脆弱なコードと対策後のコード">
      <div class="code-head">
        <div class="kicker">Code · target/app.ts</div>
        <div class="where" id="codeWhere"></div>
        <div class="point" id="codePoint"></div>
        <div class="now" id="codeNow"></div>
      </div>
      <div class="code-body" id="codeBody"></div>
      <div class="code-foot">差分の行に <span class="mono">-</span> / <span class="mono">+</span>。全体は <span class="mono">target/app.ts</span> の ★ / ✅ を参照。</div>
      <!-- 右下: 学習用コントロール(デモの .panel をここへ移す) -->
      <section class="controls" id="controls" aria-label="学習用コントロール" hidden>
        <div class="kicker" style="margin-bottom:4px">Controls · 学習用コントロール</div>
        <div id="controlsSlot"></div>
      </section>
    </aside>
    </div>
  </div>

  <script src="snippets.js"></script>
  <script>
    // 攻撃モジュールの定義。実在事例(case)→架空シナリオの対で学ぶ。
    const MODULES = [
      { id: 'clickjacking', t: 'クリックジャッキング', s: 'ライクジャッキング', case: 'Facebook 2010',        status: 'ready', src: 'evil-sns.html' },
      { id: 'xss',          t: 'XSS',                   s: 'クロスサイトスクリプティング', case: 'MySpace Samy 2005', status: 'ready', src: 'evil-xss.html' },
      { id: 'sqli',         t: 'SQLインジェクション',    s: '認証バイパス / データ窃取', case: 'Sony Pictures 2011', status: 'ready', src: 'evil-sqli.html' },
      { id: 'oscmd',        t: 'OSコマンドインジェクション', s: 'ping診断ツール', case: 'Shellshock 2014',       status: 'ready', src: 'evil-oscmd.html' },
      { id: 'pathtrav',     t: 'パストラバーサル',        s: '添付ファイル閲覧', case: 'Apache 2021-41773',     status: 'ready', src: 'evil-pathtrav.html' },
      { id: 'csrf',         t: 'CSRF',                   s: 'クロスサイトリクエストフォージェリ', case: 'Netflix 2006',  status: 'ready', src: 'evil-csrf.html' },
      { id: 'authz',        t: '認可制御の欠落',          s: 'IDOR / BOLA', case: 'First American 2019',          status: 'ready', src: 'evil-authz.html' },
    ];

    const nav = document.getElementById('nav');
    const demo = document.getElementById('demo');
    const empty = document.getElementById('empty');
    const barNum = document.getElementById('barNum');
    const barTitle = document.getElementById('barTitle');
    const barSub = document.getElementById('barSub');
    const barCase = document.getElementById('barCase');
    const barLive = document.getElementById('barLive');
    const reloadBtn = document.getElementById('reloadBtn');
    const openBtn = document.getElementById('openBtn');
    const codeBtn = document.getElementById('codeBtn');
    let activeId = null;

    // ---- 右ペイン: 脆弱/対策 コード比較 ----
    const SNIPPETS = window.LAB_SNIPPETS || {};
    const codeWhere = document.getElementById('codeWhere');
    const codePoint = document.getElementById('codePoint');
    const codeNow = document.getElementById('codeNow');
    const codeBody = document.getElementById('codeBody');
    let defended = false;

    const esc = (t) => t.replace(/[&<>"']/g, (ch) =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch]);
    const isNote = (l) => l.trim() === '' || l.trim().startsWith('//');

    // もう片方に無い行 = 差分。脆弱側は「-」、対策側は「+」で示す。
    function snipHtml(kind, lines, other) {
      const otherSet = new Set(other.filter((l) => !isNote(l)).map((l) => l.trim()));
      const mark = kind === 'vuln' ? '-' : '+';
      const body = lines.map((l) => {
        const note = isNote(l);
        const diff = !note && !otherSet.has(l.trim());
        return '<span class="ln' + (note ? ' note' : '') + (diff ? ' diff' : '') +
          '" data-mark="' + (diff ? mark : ' ') + '">' + (esc(l) || ' ') + '</span>';
      }).join('');
      const name = kind === 'vuln' ? '★ 脆弱' : '✅ 対策 (?defense=1)';
      return '<div class="snip ' + kind + '" data-kind="' + kind + '">' +
        '<div class="label"><span class="name">' + name + '</span><span class="running">実行中</span></div>' +
        '<pre>' + body + '</pre></div>';
    }

    function renderCode() {
      const s = SNIPPETS[activeId];
      if (!s) {
        codeWhere.textContent = '';
        codePoint.textContent = 'このモジュールのコード片はまだありません。';
        codeNow.textContent = '';
        codeBody.innerHTML = '';
        return;
      }
      codeWhere.textContent = s.where;
      codePoint.textContent = s.point;
      codeBody.innerHTML = snipHtml('vuln', s.vuln, s.defense) + snipHtml('defense', s.defense, s.vuln);
      applyDefense();
    }

    function applyDefense() {
      for (const el of codeBody.querySelectorAll('.snip')) {
        el.classList.toggle('active', (el.dataset.kind === 'defense') === defended);
      }
      codeNow.textContent = 'デモはいま ' + (defended ? '対策版' : '脆弱版') +
        ' で動作中（右下の「🛡 対策を有効化」と連動）';
    }

    // デモ(iframe)からのトグル通知。表示中のデモから来たものだけ受け付ける。
    window.addEventListener('message', (e) => {
      if (e.source !== demo.contentWindow) return;
      const d = e.data;
      if (!d || d.type !== 'lab:defense') return;
      defended = Boolean(d.on);
      applyDefense();
    });
    // デモを読み込み直すとトグルは初期状態(脆弱)に戻るので、表示も戻す。
    demo.addEventListener('load', () => {
      defended = false;
      applyDefense();
      mountControls();
    });

    // デモ内の学習用コントロール(.panel)を右下の領域へ移す。
    //   同一オリジンなので adoptNode で DOM ごと移動でき、デモ側のイベントリスナ
    //   (トグルで body のクラスを切り替える等)はデモの document に対してそのまま働く。
    const controls = document.getElementById('controls');
    const controlsSlot = document.getElementById('controlsSlot');
    function mountControls() {
      controlsSlot.replaceChildren();
      controls.hidden = true;
      let panel = null;
      try {
        panel = demo.contentDocument && demo.contentDocument.querySelector('.panel');
      } catch { panel = null; } // 別オリジン等で読めない場合はデモ内に残す
      if (!panel) return;
      controlsSlot.appendChild(document.adoptNode(panel));
      controls.hidden = false;
      // 移したトグルの現在値を右ペインのコード表示にも反映する。
      const def = panel.querySelector('#toggleDefense');
      if (def) { defended = def.checked; applyDefense(); }
    }

    // コードペインの表示/非表示(閲覧者ごとの好みとして保存)。
    function setCodeVisible(on) {
      document.body.classList.toggle('hide-code', !on);
      codeBtn.setAttribute('aria-pressed', String(on));
      try { localStorage.setItem('lab:code', on ? '1' : '0'); } catch {}
    }
    codeBtn.addEventListener('click', () =>
      setCodeVisible(document.body.classList.contains('hide-code')));
    try { if (localStorage.getItem('lab:code') === '0') setCodeVisible(false); } catch {}

    // サイドバーの進捗メタ
    const readyMods = MODULES.filter((m) => m.status === 'ready');
    document.getElementById('readyCount').textContent = String(readyMods.length);
    document.getElementById('totalCount').textContent = String(MODULES.length);
    document.getElementById('progressBar').style.width =
      Math.round((readyMods.length / MODULES.length) * 100) + '%';

    function updateTopbar(mod) {
      const i = MODULES.indexOf(mod) + 1;
      barNum.textContent = String(i).padStart(2, '0');
      barTitle.textContent = mod.t;
      barSub.textContent = mod.s || '';
      if (mod.case) { barCase.textContent = mod.case; barCase.hidden = false; }
      else { barCase.hidden = true; }
      const ready = mod.status === 'ready';
      barLive.hidden = !ready;
      reloadBtn.hidden = !ready;
      openBtn.hidden = !ready;
    }

    function select(mod) {
      if (mod.status !== 'ready') {
        demo.hidden = true; demo.removeAttribute('src');
        empty.hidden = false;
        controlsSlot.replaceChildren(); controls.hidden = true;
      } else {
        empty.hidden = true; demo.hidden = false;
        demo.src = mod.src;
      }
      activeId = mod.id;
      location.hash = mod.id;
      updateTopbar(mod);
      render();
      defended = false;
      renderCode();
    }

    function render() {
      nav.innerHTML = '<div class="nav-label kicker">攻撃ベクター / Attack Vectors</div>';
      MODULES.forEach((m, i) => {
        const el = document.createElement('button');
        el.className = 'item ' + m.status + (m.id === activeId ? ' active' : '');
        el.setAttribute('aria-current', m.id === activeId ? 'true' : 'false');
        el.innerHTML =
          '<span class="idx">' + String(i + 1).padStart(2, '0') + '</span>' +
          '<span class="body">' +
            '<span class="t">' + m.t + '</span>' +
            (m.s ? '<span class="s">' + m.s + '</span>' : '') +
            (m.case ? '<span class="case">' + m.case + '</span>' : '') +
          '</span>' +
          '<span class="dot ' + m.status + '" title="' + (m.status === 'ready' ? '実装済み' : '準備中') + '"></span>';
        el.addEventListener('click', () => select(m));
        nav.appendChild(el);
      });
    }

    // 操作: 再読み込み / 別タブ
    reloadBtn.addEventListener('click', () => {
      const mod = MODULES.find((m) => m.id === activeId);
      if (mod && mod.status === 'ready') { demo.src = mod.src; }
    });
    openBtn.addEventListener('click', () => {
      const mod = MODULES.find((m) => m.id === activeId);
      if (mod && mod.src) { window.open(mod.src, '_blank', 'noopener'); }
    });

    // キーボード操作(Linear 風の keyboard-first を少しだけ)
    document.addEventListener('keydown', (e) => {
      if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
      const idx = MODULES.findIndex((m) => m.id === activeId);
      if (e.key === 'ArrowDown' || e.key === 'j') {
        e.preventDefault(); select(MODULES[Math.min(idx + 1, MODULES.length - 1)]);
      } else if (e.key === 'ArrowUp' || e.key === 'k') {
        e.preventDefault(); select(MODULES[Math.max(idx - 1, 0)]);
      } else if (e.key === 'o' || e.key === 'O') {
        openBtn.click();
      } else if (e.key === 'r' || e.key === 'R') {
        reloadBtn.click();
      } else if (e.key === 'c' || e.key === 'C') {
        codeBtn.click();
      }
    });

    // 初期表示: URLハッシュ、無ければ最初の実装済みモジュール。
    const fromHash = MODULES.find((m) => m.id === location.hash.slice(1));
    const first = MODULES.find((m) => m.status === 'ready');
    select(fromHash || first || MODULES[0]);
  </script>
</body>
</html>
