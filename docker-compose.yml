# ============================================================================
# secrity-labs-2026 ― クリックジャッキング学習ラボ
# ----------------------------------------------------------------------------
# 安全の大前提:
#   - ポートは "127.0.0.1" のみにバインド → 外部ネットワークへは出さない。
#   - 教育目的の意図的に脆弱なアプリ。公開サーバに置かないこと。
# ============================================================================

services:
  target:
    build: ./target
    # 127.0.0.1 限定公開。"8080:8080" だと全NIFに晒れるので必ず 127.0.0.1 を付ける。
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - labnet

  attacker:
    build: ./attacker
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - labnet

networks:
  labnet:
    driver: bridge
